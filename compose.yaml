services:
  mysql:
    image: mysql:8.4
    container_name: omni-management-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: OMNI_MANAGEMENT
      MYSQL_USER: sling
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
